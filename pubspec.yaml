name: redler
description: "AI-Based Cognitive Gaming and Memory Assistance Platform for Elderly Dementia Patients in NER"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Local Database
  sqflite: ^2.4.1
  path: ^1.9.0
  flutter_secure_storage: ^9.2.4

  # Backend & Network
  supabase_flutter: ^2.8.3
  connectivity_plus: ^7.3.1

  # Accessibility & Voice
  speech_to_text: ^7.4.0
  flutter_tts: ^4.2.5

  # Notifications & Background
  flutter_local_notifications: ^18.0.1
  timezone: ^0.10.1

  # UI, Fonts & Utilities
  google_fonts: ^6.2.1
  uuid: ^4.5.1
  intl: ^0.20.2
  flutter_timezone: ^5.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/lang/